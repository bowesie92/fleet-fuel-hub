# Manual station fixes. This file is the ONLY place for them (contracts section 4.11).
# Matching uses osm_ref, because station IDs renumber whenever the station filter changes.
# station_id records the ID when the entry was written, for readers only.
# Actions: exclude | merge_into (needs target_osm_ref) | rename (needs new_name) | add (needs add_id,
# name, lat, lon, source_url, reason). An add must come from a chain's or cardlock network's own public
# locator showing diesel with truck lanes or rig access. Never from satellite imagery (SPEC section 3).
# Forbidden-term exclusions use reason "name conflict" and never record the name.
# Every entry applied is logged in dq_log as a station_override row.

overrides:
  - osm_ref: "node/12297548599"
    station_id: "STN-009"
    action: exclude
    reason: "CAT Scale: a truck scale, not a fuel stop."

  - osm_ref: "way/728194668"
    station_id: "STN-030"
    action: merge_into
    target_osm_ref: "node/12234391042"
    reason: "Same site mapped twice as STN-006 (about 80 m apart); one record lacks a brand."

  - osm_ref: "node/4854438923"
    station_id: "STN-020"
    action: merge_into
    target_osm_ref: "node/12256366613"
    reason: "Same site mapped twice as STN-007 (about 80 m apart); one record lacks a brand."

